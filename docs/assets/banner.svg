<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6e0d2" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f5f0"/>
      <stop offset="0.72" stop-color="#f7f5f0" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f7f5f0" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      .display { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -3px; fill: #14130f; }
      .label { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1600" height="600" fill="#f7f5f0"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <rect width="1600" height="600" fill="url(#fade)"/>

  <!-- wordmark -->
  <rect x="96" y="84" width="22" height="22" fill="#14130f"/>
  <text x="132" y="103" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#14130f" letter-spacing="-0.5">TinyClone</text>

  <!-- headline -->
  <text x="92" y="266" class="display" font-size="92">Every file job,</text>
  <text x="92" y="366" class="display" font-size="92" fill="#5f5c54">done in one place.</text>

  <text x="96" y="424" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#5f5c54">Merge, shrink, convert, sign and tidy everyday files — 253 tools,</text>
  <text x="96" y="460" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#5f5c54">210 wired to real engines. No account, files deleted after an hour.</text>

  <!-- category chips -->
  <g transform="translate(96 512)">
    <rect x="0" y="0" width="112" height="8" fill="#b03a2e"/>
    <rect x="120" y="0" width="112" height="8" fill="#2a6f97"/>
    <rect x="240" y="0" width="112" height="8" fill="#6a4c93"/>
    <rect x="360" y="0" width="112" height="8" fill="#9c6b16"/>
    <rect x="480" y="0" width="112" height="8" fill="#24735f"/>
    <rect x="600" y="0" width="112" height="8" fill="#46566e"/>
  </g>

  <!-- stat block -->
  <g transform="translate(1150 118)">
    <rect x="0" y="0" width="354" height="364" fill="#ffffff" stroke="#14130f" stroke-width="1.5"/>
    <text x="30" y="52" class="label" font-size="12" fill="#8c887e">Working right now</text>
    <text x="30" y="140" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#14130f" letter-spacing="-1">210</text>
    <text x="30" y="172" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#5f5c54">of 253 catalogued tools</text>

    <line x1="30" y1="200" x2="324" y2="200" stroke="#14130f" stroke-width="1.5"/>
    <g font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#14130f">
      <text x="30" y="234">PDF</text><text x="270" y="234" fill="#5f5c54">35</text>
      <text x="30" y="266">Image</text><text x="270" y="266" fill="#5f5c54">47</text>
      <text x="30" y="298">Video</text><text x="270" y="298" fill="#5f5c54">59</text>
      <text x="30" y="330">Write</text><text x="270" y="330" fill="#5f5c54">53</text>
    </g>
  </g>
</svg>
